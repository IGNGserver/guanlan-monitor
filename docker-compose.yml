name: device-state-console

services:
  redis:
    image: ${DSC_REDIS_IMAGE_REF:-redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: ${DSC_MYSQL_IMAGE_REF:-mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb}
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  server:
    image: ${DSC_SERVER_IMAGE_REF:-${DSC_SERVER_IMAGE:-ghcr.io/igngserver/device-state-console-server}:${DSC_VERSION:?Set DSC_VERSION to a release version or latest}}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DSC_VERSION: ${DSC_VERSION:?Set DSC_VERSION to a release version or latest}
      DSC_RELEASE_CHANNEL: ${DSC_RELEASE_CHANNEL:-test}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      SESSION_COOKIE_SECURE: "true"
      AGENT_REQUIRE_HTTPS: "${AGENT_REQUIRE_HTTPS:-true}"
      TRUST_PROXY: "true"
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to an authenticated Redis URL}
      MYSQL_URL: "${MYSQL_URL:-mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}}"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  web:
    image: ${DSC_WEB_IMAGE_REF:-${DSC_WEB_IMAGE:-ghcr.io/igngserver/device-state-console-web}:${DSC_VERSION:?Set DSC_VERSION to a release version or latest}}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DSC_VERSION: ${DSC_VERSION:?Set DSC_VERSION to a release version or latest}
      DSC_RELEASE_CHANNEL: ${DSC_RELEASE_CHANNEL:-test}
      SERVER_API_URL: http://server:4000
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      - server

volumes:
  redis-data:
  mysql-data:
