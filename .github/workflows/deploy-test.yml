name: Deploy test Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published image version without the v prefix"
        required: true
        type: string
      channel:
        description: "The isolated test deployment channel"
        required: true
        type: choice
        options:
          - test

permissions:
  contents: read
  packages: read

concurrency:
  group: test-hub-deployment
  cancel-in-progress: false

jobs:
  stage-images:
    name: Stage fixed test images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull and archive fixed application images
        shell: bash
        env:
          DSC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker pull "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}"
          docker pull "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}"
          docker image inspect \
            "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}" \
            "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}" >/dev/null
          mkdir -p image-bundle
          docker save \
            "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}" \
            "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}" \
            | gzip -1 > image-bundle/dsc-test-images.tar.gz
          ls -lh image-bundle/dsc-test-images.tar.gz

      - name: Upload staged images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsc-test-images-${{ inputs.version }}
          path: image-bundle/dsc-test-images.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy fixed test version
    runs-on: [self-hosted, Linux, X64, nas]
    needs: stage-images
    timeout-minutes: 30
    environment: test
    steps:
      - name: Validate requested version and channel
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Test deployment requires a fixed semantic version." >&2
            exit 1
          }
          [[ "$REQUESTED_CHANNEL" == "test" ]] || {
            echo "Test deployment accepts only the test channel." >&2
            exit 1
          }

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -n "$DEPLOY_HOST" ]]; then
            test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is required for remote test deployment." >&2; exit 1; }
            test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS is required for remote test deployment." >&2; exit 1; }
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          else
            echo "SSH deploy secrets are not used for the local NAS runner deployment."
          fi

      - name: Checkout deployment definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v${{ inputs.version }}
          sparse-checkout: |
            docker-compose.yml
            scripts/prepare-compose-env.sh
            scripts/verify-widget-layout-persistence.sh
          sparse-checkout-cone-mode: false

      - name: Download staged images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dsc-test-images-${{ inputs.version }}
          path: ${{ runner.temp }}/dsc-test-images

      - name: Load staged images
        shell: bash
        env:
          DSC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dsc-test-images/dsc-test-images.tar.gz"
          test -f "$archive"
          gzip -dc "$archive" | docker load
          docker image inspect \
            "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}" \
            "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}" >/dev/null

      - name: Preserve server data and sync Compose definition
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          DSC_VERSION: ${{ inputs.version }}
          DSC_RELEASE_CHANNEL: ${{ inputs.channel }}
          WEB_PORT: "3100"
        run: |
          set -euo pipefail
          backup_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if [[ -z "$DEPLOY_HOST" ]]; then
            DEPLOY_PATH="${DEPLOY_PATH:-/vol2/1000/Docker/device-state-console}"
            test -d "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH/data" "$DEPLOY_PATH/backups"
            cd "$DEPLOY_PATH"
            export WEB_PORT DSC_VERSION DSC_RELEASE_CHANNEL
            export DSC_SERVER_IMAGE='ghcr.io/igngserver/device-state-console-server'
            export DSC_WEB_IMAGE='ghcr.io/igngserver/device-state-console-web'
            server_container="$(docker ps -aq --filter name=device-state-console-server-1 | head -n 1 || true)"
            if [[ -n "$server_container" ]]; then
              docker cp "$server_container:/app/data/local-db.json" "$DEPLOY_PATH/backups/local-db.json.$backup_stamp" 2>/dev/null || true
            fi
            backup_file="$DEPLOY_PATH/backups/local-db.json.$backup_stamp"
            if [[ ! -s "$DEPLOY_PATH/data/local-db.json" && -s "$backup_file" ]]; then
              cp "$backup_file" "$DEPLOY_PATH/data/local-db.json.tmp"
              mv "$DEPLOY_PATH/data/local-db.json.tmp" "$DEPLOY_PATH/data/local-db.json"
            fi
            bash "$GITHUB_WORKSPACE/scripts/prepare-compose-env.sh" "$DEPLOY_PATH/.env"
            temp="$DEPLOY_PATH/.docker-compose.yml.codex.tmp"
            cp "$GITHUB_WORKSPACE/docker-compose.yml" "$temp"
            mv "$temp" "$DEPLOY_PATH/docker-compose.yml"
            grep -Fq './data:/app/data' "$DEPLOY_PATH/docker-compose.yml"
          else
            test -n "$DEPLOY_USER"
            test -n "$DEPLOY_PATH"
            test -s "$HOME/.ssh/id_ed25519"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; \
               mkdir -p '$DEPLOY_PATH/data' '$DEPLOY_PATH/backups'; \
               server_container=\$(docker ps -aq --filter name=device-state-console-server-1 | head -n 1 || true); \
               if [ -n \"\$server_container\" ]; then docker cp \"\$server_container:/app/data/local-db.json\" '$DEPLOY_PATH/backups/local-db.json.$backup_stamp' 2>/dev/null || true; fi; \
               backup_file='$DEPLOY_PATH/backups/local-db.json.$backup_stamp'; \
               if [ ! -s '$DEPLOY_PATH/data/local-db.json' ] && [ -s \"\$backup_file\" ]; then cp \"\$backup_file\" '$DEPLOY_PATH/data/local-db.json.tmp'; mv '$DEPLOY_PATH/data/local-db.json.tmp' '$DEPLOY_PATH/data/local-db.json'; fi"
            remote_compose="$DEPLOY_PATH/.docker-compose.yml.codex.tmp"
            remote_prepare="$DEPLOY_PATH/.prepare-compose-env.codex.tmp"
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" "$GITHUB_WORKSPACE/docker-compose.yml" \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_compose"
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" "$GITHUB_WORKSPACE/scripts/prepare-compose-env.sh" \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_prepare"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; cleanup() { rm -f '$remote_compose' '$remote_prepare'; }; trap cleanup EXIT; bash '$remote_prepare' '$DEPLOY_PATH/.env'; mv '$remote_compose' '$DEPLOY_PATH/docker-compose.yml'; grep -Fq './data:/app/data' '$DEPLOY_PATH/docker-compose.yml'; rm -f '$remote_prepare'; trap - EXIT"
          fi

      - name: Pull and restart fixed test images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          DSC_VERSION: ${{ inputs.version }}
          DSC_RELEASE_CHANNEL: ${{ inputs.channel }}
          WEB_PORT: "3100"
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" ]]; then
            DEPLOY_PATH="${DEPLOY_PATH:-/vol2/1000/Docker/device-state-console}"
            test -d "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            export WEB_PORT DSC_VERSION DSC_RELEASE_CHANNEL
            export DSC_SERVER_IMAGE='ghcr.io/igngserver/device-state-console-server'
            export DSC_WEB_IMAGE='ghcr.io/igngserver/device-state-console-web'
            previous="$(docker inspect --format '{{.Config.Image}}' $(docker compose ps -q server) 2>/dev/null | sed -E 's/.*:([^:]+)$/\1/' || true)"
            docker compose up -d --no-build redis mysql
            infra_healthy=0
            for attempt in $(seq 1 30); do
              if docker compose exec -T redis sh -c 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG' \
                && docker compose exec -T mysql sh -c 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'; then
                infra_healthy=1
                break
              fi
              sleep 5
            done
            [[ "$infra_healthy" -eq 1 ]] || { echo 'Redis/MySQL migration health check failed.' >&2; exit 1; }
            docker compose up -d --no-deps --pull never server web
            healthy=0
            for attempt in $(seq 1 30); do
              if docker compose exec -T server node -e "fetch('http://127.0.0.1:4000/api/system/version').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [[ "$healthy" -ne 1 ]]; then
              echo 'Test deployment health check failed; attempting rollback.' >&2
              if [[ -n "$previous" ]]; then
                DSC_VERSION="$previous" DSC_RELEASE_CHANNEL='test' docker compose up -d --no-deps --pull never server web
              fi
              exit 1
            fi
            docker compose ps
          else
            test -n "$DEPLOY_USER"
            test -n "$DEPLOY_PATH"
            test -s "$HOME/.ssh/id_ed25519"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; \
               cd '$DEPLOY_PATH'; \
               export WEB_PORT='$WEB_PORT' DSC_VERSION='$DSC_VERSION' DSC_RELEASE_CHANNEL='$DSC_RELEASE_CHANNEL' DSC_SERVER_IMAGE='ghcr.io/igngserver/device-state-console-server' DSC_WEB_IMAGE='ghcr.io/igngserver/device-state-console-web'; \
               if [ -f .env ]; then legacy_mysql_url=\$(sed -n 's/^MYSQL_URL=//p' .env | head -n 1 | tr -d '\\r'); if [ -n \"\$legacy_mysql_url\" ]; then legacy_mysql_url=\${legacy_mysql_url/@127.0.0.1:/@mysql:}; legacy_mysql_url=\${legacy_mysql_url/@localhost:/@mysql:}; export MYSQL_URL=\"\$legacy_mysql_url\"; fi; fi; \
               previous=\$(docker inspect --format '{{.Config.Image}}' \$(docker compose ps -q server) 2>/dev/null | sed -E 's/.*:([^:]+)$/\\1/' || true); \
               docker compose up -d --no-build redis mysql; \
               infra_healthy=0; for attempt in \$(seq 1 30); do \
                 if docker compose exec -T redis sh -c 'redis-cli --no-auth-warning -a "\$REDIS_PASSWORD" ping | grep -q PONG' && docker compose exec -T mysql sh -c 'mysqladmin ping -h 127.0.0.1 -uroot -p"\$MYSQL_ROOT_PASSWORD" --silent'; then infra_healthy=1; break; fi; \
                 sleep 5; \
               done; \
               if [ "\$infra_healthy" -ne 1 ]; then echo 'Redis/MySQL migration health check failed.' >&2; exit 1; fi; \
               docker compose up -d --no-deps --pull never server web; \
               healthy=0; for attempt in \$(seq 1 30); do \
                 if docker compose exec -T server node -e \"fetch('http://127.0.0.1:4000/api/system/version').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"; then healthy=1; break; fi; \
                 sleep 5; \
               done; \
               if [ \"\$healthy\" -ne 1 ]; then \
                 echo 'Test deployment health check failed; attempting rollback.' >&2; \
                 if [ -n \"\$previous\" ]; then DSC_VERSION=\"\$previous\" DSC_RELEASE_CHANNEL='test' docker compose up -d --no-deps --pull never server web; fi; \
                 exit 1; \
               fi; \
               docker compose ps"
          fi

      - name: Verify widget layouts survive server recreation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          DSC_VERSION: ${{ inputs.version }}
          DSC_RELEASE_CHANNEL: ${{ inputs.channel }}
          WEB_PORT: "3100"
          SMOKE_SCOPE: __codex_widget_smoke__${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" ]]; then
            DEPLOY_PATH="${DEPLOY_PATH:-/vol2/1000/Docker/device-state-console}"
            test -d "$DEPLOY_PATH"
            SMOKE_BASE_URL="http://127.0.0.1:3100" \
              SMOKE_COMPOSE_DIR="$DEPLOY_PATH" \
              DSC_VERSION="$DSC_VERSION" \
              DSC_RELEASE_CHANNEL="$DSC_RELEASE_CHANNEL" \
              WEB_PORT="$WEB_PORT" \
              SMOKE_SCOPE="$SMOKE_SCOPE" \
              bash "$GITHUB_WORKSPACE/scripts/verify-widget-layout-persistence.sh"
          else
            test -n "$DEPLOY_USER"
            test -n "$DEPLOY_PATH"
            test -s "$HOME/.ssh/id_ed25519"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "SMOKE_BASE_URL='http://127.0.0.1:3100' SMOKE_COMPOSE_DIR='$DEPLOY_PATH' DSC_VERSION='$DSC_VERSION' DSC_RELEASE_CHANNEL='$DSC_RELEASE_CHANNEL' WEB_PORT='$WEB_PORT' SMOKE_SCOPE='$SMOKE_SCOPE' bash -s" \
              < "$GITHUB_WORKSPACE/scripts/verify-widget-layout-persistence.sh"
          fi
