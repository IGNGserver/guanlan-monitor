name: Deploy test Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published image version without the v prefix"
        required: true
        type: string
      channel:
        description: "The isolated test deployment channel"
        required: true
        type: choice
        options:
          - test

permissions:
  contents: read

concurrency:
  group: test-hub-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fixed test version
    runs-on: [self-hosted, Linux, X64, nas]
    environment: test
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Validate requested version and channel
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$REQUESTED_VERSION" == "$version" ]] || {
            echo "Requested version $REQUESTED_VERSION does not match VERSION $version." >&2
            exit 1
          }
          [[ "$REQUESTED_VERSION" != "latest" ]] || {
            echo "Test deployment requires a fixed version." >&2
            exit 1
          }
          [[ "$REQUESTED_CHANNEL" == "test" ]] || {
            echo "Test deployment accepts only the test channel." >&2
            exit 1
          }

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Pull and restart fixed test images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          DSC_VERSION: ${{ inputs.version }}
          DSC_RELEASE_CHANNEL: ${{ inputs.channel }}
          WEB_PORT: "3100"
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             cd '$DEPLOY_PATH'; \
             export WEB_PORT='$WEB_PORT' DSC_VERSION='$DSC_VERSION' DSC_RELEASE_CHANNEL='$DSC_RELEASE_CHANNEL'; \
             previous=\$(docker inspect --format '{{.Config.Image}}' \$(docker compose ps -q server) 2>/dev/null | sed -E 's/.*:([^:]+)$/\\1/' || true); \
             docker compose pull server web; \
             docker compose up -d server web; \
             healthy=0; for attempt in \$(seq 1 30); do \
               if docker compose exec -T server node -e \"fetch('http://127.0.0.1:4000/api/system/version').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"; then healthy=1; break; fi; \
               sleep 5; \
             done; \
             if [ \"\$healthy\" -ne 1 ]; then \
               echo 'Test deployment health check failed; attempting rollback.' >&2; \
               if [ -n \"\$previous\" ]; then DSC_VERSION=\"\$previous\" DSC_RELEASE_CHANNEL='test' docker compose up -d server web; fi; \
               exit 1; \
             fi; \
             docker compose ps"
