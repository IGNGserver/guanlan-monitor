name: Deploy test Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published image version without the v prefix"
        required: true
        type: string
      channel:
        description: "The isolated test deployment channel"
        required: true
        type: choice
        options:
          - test
      allow_http:
        description: "Allow HTTP sessions and Agent uploads on a trusted network"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: test-hub-deployment
  cancel-in-progress: false

jobs:
  stage-images:
    name: Stage fixed test images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull and archive fixed application images
        shell: bash
        env:
          DSC_VERSION: ${{ inputs.version }}
          DSC_REDIS_IMAGE: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          DSC_MYSQL_IMAGE: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        run: |
          set -euo pipefail
          docker pull "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}"
          docker pull "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}"
          docker pull "$DSC_REDIS_IMAGE"
          docker pull "$DSC_MYSQL_IMAGE"
          docker tag "$DSC_REDIS_IMAGE" redis:7.4-alpine
          docker tag "$DSC_MYSQL_IMAGE" mysql:8.4
          docker image inspect \
            "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}" \
            "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}" \
            "$DSC_REDIS_IMAGE" \
            "$DSC_MYSQL_IMAGE" >/dev/null
          mkdir -p image-bundle
          docker save \
            "ghcr.io/igngserver/device-state-console-server:${DSC_VERSION}" \
            "ghcr.io/igngserver/device-state-console-web:${DSC_VERSION}" \
            redis:7.4-alpine \
            mysql:8.4 \
            | gzip -1 > image-bundle/dsc-test-images.tar.gz
          (
            cd image-bundle
            sha256sum dsc-test-images.tar.gz > dsc-test-images.tar.gz.sha256
          )
          split --bytes=64m --numeric-suffixes=0 --suffix-length=3 \
            image-bundle/dsc-test-images.tar.gz \
            image-bundle/dsc-test-images.tar.gz.part-
          ls -lh image-bundle/dsc-test-images.tar.gz image-bundle/dsc-test-images.tar.gz.part-*

      - name: Upload staged image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsc-test-images-${{ inputs.version }}-manifest
          path: image-bundle/dsc-test-images.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload staged image part 000
        if: ${{ hashFiles('image-bundle/dsc-test-images.tar.gz.part-000') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsc-test-images-${{ inputs.version }}-part-000
          path: image-bundle/dsc-test-images.tar.gz.part-000
          if-no-files-found: error
          retention-days: 1

      - name: Upload staged image part 001
        if: ${{ hashFiles('image-bundle/dsc-test-images.tar.gz.part-001') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
