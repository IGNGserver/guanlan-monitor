name: Inspect test Agents

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Legacy test Agents to inspect"
        required: true
        default: "192.168.5.8 nas"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect legacy service layout
    runs-on: [self-hosted, Linux, X64, nas]
    timeout-minutes: 10
    environment: test
    steps:
      - name: Inspect service and log locations without changing targets
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.TEST_DEPLOY_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${TARGETS//[[:space:]]/}" ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          inspect_script="$RUNNER_TEMP/inspect-legacy-agents-${GITHUB_RUN_ID}.sh"
          trap 'rm -f "$inspect_script"' EXIT
          cat > "$inspect_script" <<'REMOTE'
          set -euo pipefail
          unit=device-state-console-agent.service
          dir=/opt/device-state-console-agent
          printf 'service_active=%s service_enabled=%s\n' "$(systemctl is-active "$unit" 2>/dev/null || true)" "$(systemctl is-enabled "$unit" 2>/dev/null || true)"
          exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
          exec_start_path="$(printf '%s\n' "$exec_start" | sed -nE 's/.*path=([^ ;]+).*/\1/p')"
          printf 'exec_start_path=%s\n' "${exec_start_path:-unavailable}"
          exec_arg_path="$(printf '%s\n' "$exec_start" | grep -oE '/opt/device-state-console-agent/[A-Za-z0-9._/-]+' | tail -n 1 || true)"
          printf 'exec_argument_path=%s\n' "${exec_arg_path:-unavailable}"
          printf 'unit_fragment=%s\n' "$(systemctl show "$unit" -p FragmentPath --value 2>/dev/null || true)"
          printf 'environment_files=%s\n' "$(systemctl show "$unit" -p EnvironmentFiles --value 2>/dev/null || true)"
          case "$exec_start" in
            *"path=$dir/run-dev-machine-agent.sh"*) echo 'exec_start=legacy_launcher' ;;
            *"path=$dir/device-state-console-agent"*) echo 'exec_start=collector_binary' ;;
            *) echo 'exec_start=other' ;;
          esac
          pid="$(systemctl show "$unit" -p MainPID --value 2>/dev/null || true)"
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
            printf 'main_process=%s\n' "$(basename "$(readlink -f "/proc/$pid/exe" 2>/dev/null || echo unavailable)")"
          fi
          launcher_path="$exec_arg_path"
          if [[ -f "$launcher_path" && "$launcher_path" != "$dir/device-state-console-agent" ]]; then
            printf 'launcher_has_go_build=%s launcher_calls_collector=%s launcher_writes_agent_log=%s\n' \
              "$(grep -Eq 'go[[:space:]]+build' "$launcher_path" && echo yes || echo no)" \
              "$(grep -Fq 'device-state-console-agent' "$launcher_path" && echo yes || echo no)" \
              "$(grep -Fq 'agent.err.log' "$launcher_path" && echo yes || echo no)"
          fi
          for name in run-dev-machine-agent.sh device-state-console-agent dev-machine-agent dev-machine-agent.env agent.env VERSION; do
            if [[ -f "$dir/$name" ]]; then
              printf 'file=%s present=true\n' "$name"
            else
              printf 'file=%s present=false\n' "$name"
            fi
          done
          for name in device-state-console-agent dev-machine-agent; do
            if [[ -x "$dir/$name" ]]; then
              printf 'binary=%s version=%s\n' "$name" "$("$dir/$name" version 2>/dev/null || echo unavailable)"
            fi
          done
          for name in dev-machine-agent.err.log agent.err.log; do
            if [[ -f "$dir/$name" ]]; then
              printf 'log=%s bytes=%s recent_start=%s recent_uploads=%s\n' "$name" \
                "$(stat -c '%s' "$dir/$name")" \
                "$(tail -n 200 "$dir/$name" | grep -aEo 'go agent v[0-9]+\.[0-9]+\.[0-9]+' | tail -n 1 || true)" \
                "$(tail -n 200 "$dir/$name" | grep -ac 'uploaded metrics at ' || true)"
            else
              printf 'log=%s present=false\n' "$name"
            fi
          done
          REMOTE
          for target in $TARGETS; do
            case "$target" in
              192.168.5.8|nas) ;;
              *) echo "Unsupported diagnostic target: $target" >&2; exit 1 ;;
            esac
            printf 'target=%s\n' "$target"
            if [[ "$target" == nas ]]; then
              if [[ -n "$DEPLOY_PASSWORD" ]]; then
                { printf '%s\n' "$DEPLOY_PASSWORD"; cat "$inspect_script"; } | sudo -S -p '' bash -s
              else
                sudo -n bash -s < "$inspect_script"
              fi
            else
              ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_ed25519" \
                "${DEPLOY_USER:-root}@$target" bash -s < "$inspect_script"
            fi
          done
