name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published image version without the v prefix"
        required: true
        type: string
      channel:
        description: "Release channel to use for update selection"
        required: true
        type: choice
        options:
          - stable
          - test

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fixed version
    runs-on: [self-hosted, linux, x64, nas]
    environment: production
    steps:
      - name: Validate and download requested Compose definition
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" != "latest" ]] || {
            echo "Production deployment requires a fixed version." >&2
            exit 1
          }
          release_json="$(curl -fsSL --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/IGNGserver/guanlan-monitor/releases/tags/v$REQUESTED_VERSION")"
          release_tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
          release_draft="$(printf '%s' "$release_json" | jq -r '.draft')"
          [[ "$release_tag" == "v$REQUESTED_VERSION" && "$release_draft" == "false" ]] || {
            echo "Requested version $REQUESTED_VERSION is not a published release." >&2
            exit 1
          }
          [[ "${{ inputs.channel }}" == "stable" || "${{ inputs.channel }}" == "test" ]] || {
            echo "Invalid release channel." >&2
            exit 1
          }
          curl -fsSL --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github.raw' \
            "https://api.github.com/repos/IGNGserver/guanlan-monitor/contents/docker-compose.yml?ref=v$REQUESTED_VERSION" \
            -o "$GITHUB_WORKSPACE/docker-compose.yml"
          grep -q 'ghcr.io/igngserver/device-state-console-server' "$GITHUB_WORKSPACE/docker-compose.yml"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync fixed-version Compose definition
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          backup_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             mkdir -p '$DEPLOY_PATH/data' '$DEPLOY_PATH/backups'; \
             server_container=\$(docker ps -aq --filter name=device-state-console-server-1 | head -n 1 || true); \
             if [ -n \"\$server_container\" ]; then docker cp \"\$server_container:/app/data/local-db.json\" '$DEPLOY_PATH/backups/local-db.json.$backup_stamp' 2>/dev/null || true; fi; \
             backup_file='$DEPLOY_PATH/backups/local-db.json.$backup_stamp'; \
             if [ ! -s '$DEPLOY_PATH/data/local-db.json' ] && [ -s \"\$backup_file\" ]; then cp \"\$backup_file\" '$DEPLOY_PATH/data/local-db.json.tmp'; mv '$DEPLOY_PATH/data/local-db.json.tmp' '$DEPLOY_PATH/data/local-db.json'; fi"
          remote_compose="$DEPLOY_PATH/.docker-compose.yml.codex.tmp"
          scp -i "$HOME/.ssh/id_ed25519" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$remote_compose"
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv '$remote_compose' '$DEPLOY_PATH/docker-compose.yml' && grep -Fq './data:/app/data' '$DEPLOY_PATH/docker-compose.yml'"

      - name: Authenticate NAS to GHCR for stable deployment
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"

      - name: Pull and restart published images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DSC_VERSION: ${{ inputs.version }}
          DSC_RELEASE_CHANNEL: ${{ inputs.channel }}
          WEB_PORT: "3100"
        run: |
          set -euo pipefail
          image_registry='ghcr.nju.edu.cn'
          if [[ "$DSC_RELEASE_CHANNEL" == 'test' ]]; then
            image_registry='ghcr.io'
          fi
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH' && \
             export WEB_PORT='$WEB_PORT' DSC_VERSION='$DSC_VERSION' DSC_RELEASE_CHANNEL='$DSC_RELEASE_CHANNEL' \
               DSC_SERVER_IMAGE='$image_registry/igngserver/device-state-console-server' \
               DSC_WEB_IMAGE='$image_registry/igngserver/device-state-console-web' && \
             if [ -f .env ]; then \
               legacy_mysql_url=\$(sed -n 's/^MYSQL_URL=//p' .env | head -n 1 | tr -d '\r'); \
               if [ -n \"\$legacy_mysql_url\" ]; then \
                 legacy_mysql_url=\${legacy_mysql_url/@127.0.0.1:/@mysql:}; \
                 legacy_mysql_url=\${legacy_mysql_url/@localhost:/@mysql:}; \
                 export MYSQL_URL=\"\$legacy_mysql_url\"; \
               fi; \
             fi && \
             previous=\$(docker inspect --format '{{.Config.Image}}' \$(docker compose ps -q server) 2>/dev/null | sed -E 's/.*:([^:]+)$/\\1/' || true); \
             pull_ok=0; for pull_attempt in \$(seq 1 6); do \
               if timeout 120 docker compose pull server web; then pull_ok=1; break; fi; \
               echo \"Published image pull attempt \${pull_attempt}/6 failed; retrying.\" >&2; \
               sleep 10; \
             done; \
             if [ \"\$pull_ok\" -ne 1 ]; then \
               echo 'Published image pull failed; keeping the current deployment.' >&2; \
               exit 1; \
             fi; \
             if ! docker compose up -d --no-build --no-deps server web; then \
               echo 'Deployment restart failed; attempting rollback.' >&2; \
               if [ -n \"\$previous\" ]; then DSC_VERSION=\"\$previous\" docker compose up -d --no-build --no-deps server web; fi; \
               exit 1; \
             fi; \
             server_image=\$(docker inspect --format '{{.Config.Image}}' \$(docker compose ps -q server)); \
             web_image=\$(docker inspect --format '{{.Config.Image}}' \$(docker compose ps -q web)); \
             expected_server=\"\$DSC_SERVER_IMAGE:\$DSC_VERSION\"; \
             expected_web=\"\$DSC_WEB_IMAGE:\$DSC_VERSION\"; \
             if [ \"\$server_image\" != \"\$expected_server\" ] || [ \"\$web_image\" != \"\$expected_web\" ]; then \
               echo \"Deployment image mismatch: server=\$server_image web=\$web_image expected=\$expected_server / \$expected_web\" >&2; \
               exit 1; \
             fi; \
             healthy=0; for attempt in \$(seq 1 30); do \
               if docker compose exec -T server node -e \"fetch('http://127.0.0.1:4000/api/system/version').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"; then healthy=1; break; fi; \
               sleep 5; \
             done; \
             if [ \"\$healthy\" -ne 1 ]; then \
               echo 'Deployment health check failed; attempting rollback.' >&2; \
               if [ -n \"\$previous\" ]; then DSC_VERSION=\"\$previous\" docker compose up -d --no-build --no-deps server web; fi; \
               exit 1; \
             fi; \
             docker compose ps"

      - name: Clear NAS registry credentials
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"
