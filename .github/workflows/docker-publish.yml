name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (must match VERSION; stable builds cannot use main)"
        required: true
        default: "v0.0.0"
      version:
        description: "Image version without the v prefix"
        required: true
      publish_latest:
        description: "Also update the latest tag (explicit approval required)"
        required: true
        type: boolean
        default: false
      channel:
        description: "Release channel embedded in the web image"
        required: true
        type: choice
        options:
          - stable
          - test

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/igngserver
  DSC_RELEASE_CHANNEL: ${{ inputs.channel || 'test' }}

jobs:
  verify:
    name: Verify source before image publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run publication gate
        run: |
          pnpm verify:version
          pnpm verify:windows-installer
          pnpm verify:windows-hardware
          pnpm verify:web-security-headers
          bash scripts/test-compose-env-migration.sh
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/server test
          pnpm typecheck
        env:
          NODE_ENV: test
          SESSION_SECRET: dsc-ci-session-secret-please-use-only-for-tests
          ACCESS_KEY: dsc-ci-access-key-please-use-only-for-tests

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version and tags
        id: metadata
        shell: bash
        env:
          EVENT_VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest || 'false' }}
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel || 'test' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not a semantic version." >&2; exit 1; }
          if [[ -n "${EVENT_VERSION}" && "${EVENT_VERSION}" != "${version}" ]]; then
            echo "Requested version ${EVENT_VERSION} does not match VERSION ${version}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "${tag_version}" == "${version}" ]] || { echo "Tag version ${tag_version} does not match VERSION ${version}." >&2; exit 1; }
          else
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "Docker publishing must run from a release tag." >&2; exit 1; }
            [[ "$REQUESTED_REF" == "v${version}" ]] || { echo "Manual Docker publishing must check out v${version}." >&2; exit 1; }
          fi
          if [[ "$REQUESTED_CHANNEL" == "stable" ]]; then
            [[ "$PUBLISH_LATEST" != "true" ]] || { echo "Stable images must be consumed by immutable digest; latest is not allowed." >&2; exit 1; }
            release_json="$(curl -fsSL --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/IGNGserver/guanlan-monitor/releases/tags/v${version}")"
            release_tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
            release_draft="$(printf '%s' "$release_json" | jq -r '.draft')"
            release_prerelease="$(printf '%s' "$release_json" | jq -r '.prerelease')"
            [[ "$release_tag" == "v${version}" && "$release_draft" == "false" && "$release_prerelease" == "false" ]] || {
              echo "Stable Docker publishing requires a published non-prerelease release for v${version}." >&2
              exit 1
            }
          fi
          {
            echo "version=${version}"
            echo "server_tags=${IMAGE_NAMESPACE}/device-state-console-server:${version}"
            echo "web_tags=${IMAGE_NAMESPACE}/device-state-console-web:${version}"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            {
              echo "server_tags<<EOF"
              echo "${IMAGE_NAMESPACE}/device-state-console-server:${version}"
              echo "${IMAGE_NAMESPACE}/device-state-console-server:latest"
              echo "EOF"
              echo "web_tags<<EOF"
              echo "${IMAGE_NAMESPACE}/device-state-console-web:${version}"
              echo "${IMAGE_NAMESPACE}/device-state-console-web:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.server_tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.web_tags }}
          build-args: |
            DSC_RELEASE_CHANNEL=${{ env.DSC_RELEASE_CHANNEL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
