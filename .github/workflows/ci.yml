name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify shared UI boundaries and helpers
        run: |
          pnpm check:desktop-ui-boundaries
          pnpm check:web-ui-boundary
          pnpm check:adapter-contracts
          pnpm test:adapter-contracts
          pnpm test:ui-helpers
          pnpm test:window-material

      - name: Test server VM inventory reconciliation
        run: |
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/server test
          pnpm --filter @dsc/server exec node --import tsx --test src/repositories/widget-layouts.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  go:
    name: Verify Go agents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Test Go agents
        working-directory: agents
        run: go test ./...

      - name: Build Go agents
        working-directory: agents
        run: go build ./...

  linux-gui:
    name: Verify Linux GUI package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install GTK4/libadwaita build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libadwaita-1-dev \
            libgtk-4-dev \
            libjson-glib-dev \
            libsoup-3.0-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Build and inspect Linux GUI Debian package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/device-state-console-linux-gui"
          bash ./deploy/build-linux-agent-gui.sh --output-dir "$output_dir"
          package="$(find "$output_dir" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          test "$(dpkg-deb --field "$package" Package)" = "device-state-console"
          test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
          dpkg-deb --contents "$package" | grep -F '/usr/bin/device-state-console'
          dpkg-deb --contents "$package" | grep -F '/usr/lib/systemd/user/device-state-console-agent-backend.service'

  windows-gui:
    name: Verify Windows GUI bundle
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build Windows hardware sensor probe
        shell: powershell
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "device-state-console-hardware-probe"
          dotnet publish tools/HardwareSensorProbe/HardwareSensorProbe.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $probeDir

      - name: Build Windows GUI portable bundle
        shell: powershell
        run: |
          ./deploy/build-windows-agent-portable.ps1 `
            -OutputDir "$env:RUNNER_TEMP\device-state-console-windows" `
            -HardwareProbeDir "$env:RUNNER_TEMP\device-state-console-hardware-probe" `
            -Zip

      - name: Smoke test Windows GUI bundle backend
        shell: powershell
        run: |
          ./deploy/verify-windows-agent-bundle.ps1 `
            -BundleRoot "$env:RUNNER_TEMP\device-state-console-windows\DeviceStateConsoleAgent" `
            -ConfigRoot "$env:RUNNER_TEMP\device-state-console-windows-config" `
            -ListenPort 17921 `
            -ReportPath "$env:RUNNER_TEMP\device-state-console-windows-bundle-report.json"

  desktop:
    name: Verify unified Electron desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup .NET for Windows desktop bundle
        if: matrix.target == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Linux desktop Agent bundle
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release/desktop-agent
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=${version} -X main.BuildChannel=test" -o ../release/desktop-agent/device-state-console-agent .
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=${version} -X main.BuildChannel=test" -o ../release/desktop-agent/device-state-console-agent-backend ./cmd/windows-agent-backend

      - name: Build Windows desktop Agent bundle
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path release/desktop-agent | Out-Null
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=$version -X main.BuildChannel=test" -o ..\release\desktop-agent\device-state-console-agent.exe .
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=$version -X main.BuildChannel=test" -o ..\release\desktop-agent\device-state-console-agent-backend.exe ./cmd/windows-agent-backend

      - name: Add Windows hardware sensor probe and monitor assets
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "device-state-console-hardware-probe"
          dotnet publish tools/HardwareSensorProbe/HardwareSensorProbe.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $probeDir
          New-Item -ItemType Directory -Force -Path "release/desktop-agent/hardware-sensor-probe" | Out-Null
          Copy-Item -Path (Join-Path $probeDir "*") -Destination "release/desktop-agent/hardware-sensor-probe" -Recurse -Force
          Copy-Item -Path "agents/windows-hardware" -Destination "release/desktop-agent/windows-hardware" -Recurse -Force

      - name: Typecheck and bundle renderer/main process
        run: |
          pnpm --filter @dsc/shared build
          pnpm check:desktop-ui-boundaries
          pnpm test:ui-helpers
          pnpm --filter @dsc/desktop typecheck
          pnpm --filter @dsc/desktop build

      - name: Electron package smoke test (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/device-state-console-linux"
          pnpm --filter @dsc/desktop exec electron-builder --linux dir --publish never "--config.directories.output=$output_dir"
          test -x "$output_dir/linux-unpacked/resources/agent/device-state-console-agent"
          test -x "$output_dir/linux-unpacked/resources/agent/device-state-console-agent-backend"

      - name: Electron package smoke test (Windows)
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $outputDir = Join-Path $env:RUNNER_TEMP "device-state-console-windows"
          pnpm --filter @dsc/desktop exec electron-builder --win dir --publish never "--config.directories.output=$outputDir"
          if (-not (Test-Path (Join-Path $outputDir "win-unpacked/resources/agent/device-state-console-agent.exe"))) { throw "Packaged Windows Agent binary missing." }
          if (-not (Test-Path (Join-Path $outputDir "win-unpacked/resources/agent/device-state-console-agent-backend.exe"))) { throw "Packaged Windows backend binary missing." }
          node scripts/verify-electron-artifact-version.mjs (Join-Path $outputDir "win-unpacked") $version

  web-visual:
    name: Web visual regression smoke
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web app
        run: pnpm --filter @dsc/web... build

      - name: Install isolated Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/dsc-playwright"
          mkdir -p "$playwright_dir"
          npm init -y --prefix "$playwright_dir" >/dev/null
          npm install --prefix "$playwright_dir" --no-save playwright@1.55.0 >/dev/null
          "$playwright_dir/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start Web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsc-visual"
          pnpm --filter @dsc/web start > "$RUNNER_TEMP/dsc-visual/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dsc-visual/web.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dsc-visual/web.log"
          exit 1

      - name: Run shared workspace visual smoke test
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/dsc-playwright/node_modules" node scripts/visual-regression.cjs http://127.0.0.1:3000 "$RUNNER_TEMP/dsc-visual"

      - name: Upload visual regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-regression-${{ github.sha }}
          path: ${{ runner.temp }}/dsc-visual
          if-no-files-found: warn

  electron-visual:
    name: Electron visual regression smoke
    runs-on: ubuntu-24.04
    needs: verify
    env:
      ELECTRON_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Electron runtime
        run: |
          pnpm rebuild electron
          pnpm --filter @dsc/desktop exec electron --no-sandbox --version

      - name: Build shared package and Electron renderer
        run: |
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/desktop typecheck
          pnpm --filter @dsc/desktop build

      - name: Install isolated Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          playwright_dir="$RUNNER_TEMP/dsc-electron-playwright"
          mkdir -p "$playwright_dir"
          npm init -y --prefix "$playwright_dir" >/dev/null
          npm install --prefix "$playwright_dir" --no-save playwright@1.55.0 >/dev/null
          "$playwright_dir/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run Electron shared workspace visual smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsc-electron-visual"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            env NODE_PATH="$RUNNER_TEMP/dsc-electron-playwright/node_modules" \
            node scripts/electron-visual-regression.cjs "$RUNNER_TEMP/dsc-electron-visual"

      - name: Upload Electron visual regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-visual-regression-${{ github.sha }}
          path: ${{ runner.temp }}/dsc-electron-visual
          if-no-files-found: warn
