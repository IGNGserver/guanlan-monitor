name: Update test Agents

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published test version without the v prefix"
        required: true
        type: string
      targets:
        description: "SSH host names or addresses, separated by spaces"
        required: true
        default: "192.168.5.8 192.168.5.7 192.168.5.10 nas"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: test-agent-update
  cancel-in-progress: false

jobs:
  stage:
    name: Stage Linux Agent package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify published Agent package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for command in curl sha256sum unzip; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "$command is required on the staging runner." >&2
              exit 1
            }
          done
          stage_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$stage_dir"
          asset="DeviceStateConsole-Linux-CLI-Install-v${REQUESTED_VERSION}.zip"
          base_url="https://github.com/IGNGserver/guanlan-monitor/releases/download/v${REQUESTED_VERSION}"
          curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$base_url/$asset.sha256" -o "$stage_dir/$asset.sha256"
          curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$base_url/$asset" -o "$stage_dir/$asset"
          (cd "$stage_dir" && sha256sum -c "$asset.sha256")
          unzip -tq "$stage_dir/$asset"

      - name: Upload staged Agent package
        uses: actions/upload-artifact@v4
        with:
          name: linux-agent-release-${{ inputs.version }}
          path: |
            release/DeviceStateConsole-Linux-CLI-Install-v${{ inputs.version }}.zip
            release/DeviceStateConsole-Linux-CLI-Install-v${{ inputs.version }}.zip.sha256
          if-no-files-found: error

  update:
    name: Update Linux Agents
    needs: stage
    runs-on: [self-hosted, Linux, X64, nas]
    timeout-minutes: 30
    environment: test
    steps:
      - name: Validate request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Agent update requires a fixed semantic version." >&2
            exit 1
          }
          [[ -n "${TARGETS//[[:space:]]/}" ]] || {
            echo "At least one Agent target is required." >&2
            exit 1
          }
          for target in $TARGETS; do
            [[ "$target" =~ ^[A-Za-z0-9_.:-]+$ ]] || {
              echo "Invalid SSH target: $target" >&2
              exit 1
            }
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -n "$SSH_PRIVATE_KEY" || -n "$SSH_KNOWN_HOSTS" ]]; then
            test -n "$SSH_PRIVATE_KEY"
            test -n "$SSH_KNOWN_HOSTS"
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          else
            echo 'SSH deploy secrets are empty; remote targets will use the NAS runner SSH configuration.'
          fi

      - name: Download staged Agent package
        uses: actions/download-artifact@v4
        with:
          name: linux-agent-release-${{ inputs.version }}
          path: ${{ runner.temp }}/dsc-agent-artifact-${{ github.run_id }}

      - name: Extract and verify Agent package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP:-/tmp}/dsc-agent-update-${GITHUB_RUN_ID:-manual}"
          rm -rf "$work_dir"
          artifact_dir="${RUNNER_TEMP:-/tmp}/dsc-agent-artifact-${GITHUB_RUN_ID:-manual}"
          archive="$(find "$artifact_dir" -maxdepth 1 -type f -name 'DeviceStateConsole-Linux-CLI-Install-v*.zip' -print -quit)"
          [[ -n "$archive" && -f "$archive" ]] || {
            echo "Staged Agent ZIP is unavailable." >&2
            exit 1
          }
          checksum="$archive.sha256"
          [[ -f "$checksum" ]] || {
            echo "Staged Agent checksum is unavailable." >&2
            exit 1
          }
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          package_dir="$work_dir/package"
          mkdir -p "$package_dir"
          unzip -q "$archive" -d "$package_dir"
          agent_binary="$(find "$package_dir" -type f -name 'device-state-console-agent' -print -quit)"
          [[ -n "$agent_binary" && -f "$agent_binary" ]] || {
            echo "Staged Agent package is missing the Linux Agent binary." >&2
            exit 1
          }
          chmod 0755 "$agent_binary"
          reported="$("$agent_binary" version)"
          [[ "$reported" == "$REQUESTED_VERSION (test)" ]] || {
            echo "Staged Agent reported '$reported', expected '$REQUESTED_VERSION (test)'." >&2
            exit 1
          }
          echo "Downloaded and verified Agent $reported through Actions artifacts."

      - name: Distribute and verify each Agent
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.TEST_DEPLOY_PASSWORD }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP:-/tmp}/dsc-agent-update-${GITHUB_RUN_ID:-manual}"
          trap 'rm -rf "$work_dir"' EXIT
          [[ -n "$work_dir" && -d "$work_dir/package" ]] || {
            echo "Verified Agent package directory is unavailable." >&2
            exit 1
          }
          agent_binary="$(find "$work_dir/package" -type f -name 'device-state-console-agent' -print -quit)"
          [[ -n "$agent_binary" && -f "$agent_binary" ]] || {
            echo "Verified Agent package is missing the Linux Agent binary." >&2
            exit 1
          }
          chmod 0755 "$agent_binary"

          install_script='set -euo pipefail
          version="$1"
          staged="$2"
          install_dir="/opt/device-state-console-agent"
          target="$install_dir/device-state-console-agent"
          version_file="$install_dir/VERSION"
          backup="$target.backup-$version-$$"
          owner="root:root"
          if [[ -e "$target" ]]; then
            owner="$(stat -c "%u:%g" "$target")"
          fi
          install -d -m 0755 "$install_dir"
          systemctl stop device-state-console-agent.service
          if [[ -e "$target" ]]; then
            mv "$target" "$backup"
          fi
          mv "$staged" "$target"
          chown "$owner" "$target"
          chmod 0755 "$target"
          printf "%s\n" "$version" > "$version_file"
          if ! systemctl start device-state-console-agent.service || ! systemctl is-active --quiet device-state-console-agent.service; then
            systemctl stop device-state-console-agent.service || true
            rm -f "$target"
            if [[ -e "$backup" ]]; then
              mv "$backup" "$target"
            fi
            systemctl start device-state-console-agent.service || true
            exit 1
          fi
          rm -f "$backup" "$staged"
          cat "$version_file"'

          for target in $TARGETS; do
            echo "Updating Agent on $target"
            if [[ "$target" == 'nas' || "$target" == 'localhost' || "$target" == '127.0.0.1' ]]; then
              local_stage="/opt/device-state-console-agent/.dsc-agent-${REQUESTED_VERSION}.new"
              if [[ -n "$DEPLOY_PASSWORD" ]]; then
                printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S -p '' install -m 0755 "$agent_binary" "$local_stage"
                reported="$(
                  {
                    printf '%s\n' "$DEPLOY_PASSWORD"
                    printf '%s\n' "$install_script"
                  } | sudo -S -p '' bash -s -- "$REQUESTED_VERSION" "$local_stage"
                )"
              else
                sudo -n install -m 0755 "$agent_binary" "$local_stage"
                reported="$(sudo -n bash -s -- "$REQUESTED_VERSION" "$local_stage" <<< "$install_script")"
              fi
            else
              remote_user="${DEPLOY_USER:-root}"
              ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
              if [[ -s "$HOME/.ssh/id_ed25519" ]]; then
                ssh_options+=(-i "$HOME/.ssh/id_ed25519")
              fi
              remote_stage="/tmp/dsc-agent-${REQUESTED_VERSION}-${RANDOM}.new"
              scp "${ssh_options[@]}" "$agent_binary" "$remote_user@$target:$remote_stage"
              reported="$(ssh "${ssh_options[@]}" "$remote_user@$target" \
                bash -s -- "$REQUESTED_VERSION" "$remote_stage" <<< "$install_script")"
            fi
            echo "$target: Agent $reported"
            [[ "$(tr -d '[:space:]' <<< "$reported")" == "$REQUESTED_VERSION" ]] || {
              echo "Agent on $target did not report version $REQUESTED_VERSION." >&2
              exit 1
            }
          done
