name: Update test Agents

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fixed published test version without the v prefix"
        required: true
        type: string
      rollback_versions:
        description: "Installed fixed Debian package versions to stage for rollback, separated by spaces"
        required: true
        default: "3.0.84"
        type: string
      targets:
        description: "SSH host names or addresses, separated by spaces"
        required: true
        default: "192.168.5.8 192.168.5.64 192.168.5.32 nas"
        type: string
      allow_known_http_400_targets:
        description: "Explicitly permit a configured modern Agent with pending samples and the known HTTP 400 rejection; use only after confirming the payload schema cause"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: test-agent-update
  cancel-in-progress: false

jobs:
  stage:
    name: Stage Linux Agent package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pinned update script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Download and verify published Agent package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ROLLBACK_VERSIONS: ${{ inputs.rollback_versions }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Agent update requires a fixed semantic version." >&2
            exit 1
          }
          for command in curl sha256sum dpkg-deb; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "$command is required on the staging runner." >&2
              exit 1
            }
          done
          stage_dir="$GITHUB_WORKSPACE/release"
          mkdir -p "$stage_dir"

          verify_asset_checksum() {
            local file="$1"
            local manifest="$2"
            local expected actual
            expected="$(awk 'NR == 1 { print $1 }' "$manifest")"
            [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]] || {
              echo "The checksum manifest is invalid: $manifest" >&2
              exit 1
            }
            actual="$(sha256sum "$file" | awk '{ print $1 }')"
            [[ "$actual" == "$expected" ]] || {
              echo "The checksum does not match its manifest: $file" >&2
              exit 1
            }
          }

          asset="DeviceStateConsole-Linux-Install-v${REQUESTED_VERSION}.deb"
          base_url="https://github.com/IGNGserver/guanlan-monitor/releases/download/v${REQUESTED_VERSION}"
          curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$base_url/$asset.sha256" -o "$stage_dir/$asset.sha256"
          curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$base_url/$asset" -o "$stage_dir/$asset"
          verify_asset_checksum "$stage_dir/$asset" "$stage_dir/$asset.sha256"
          echo "The Linux package SHA-256 checksum is verified."
          [[ "$(dpkg-deb -f "$stage_dir/$asset" Version)" == "$REQUESTED_VERSION" ]] || {
            echo "The Debian package version does not match the requested release." >&2
            exit 1
          }
          dpkg-deb --info "$stage_dir/$asset"
          extract_dir="$stage_dir/agent-payload"
          mkdir -p "$extract_dir"
          dpkg-deb -x "$stage_dir/$asset" "$extract_dir"
          agent_binary="$(find "$extract_dir" -type f -path '*/resources/agent/device-state-console-agent' -print -quit)"
          agent_cli="$(find "$extract_dir" -type f -path '*/resources/agent/guanlan-agent' -print -quit)"
          [[ -n "$agent_binary" && -x "$agent_binary" ]] || {
            echo "The Linux package does not contain an executable collector." >&2
            exit 1
          }
          [[ -n "$agent_cli" && -x "$agent_cli" ]] || {
            echo "The Linux package does not contain the Guanlan Agent CLI." >&2
            exit 1
          }
          expected="$REQUESTED_VERSION (test)"
          [[ "$("$agent_binary" version)" == "$expected" ]] || {
            echo "The package collector version or channel does not match the requested test release." >&2
            exit 1
          }
          [[ "$("$agent_cli" version)" == "$expected" ]] || {
            echo "The package Agent CLI version or channel does not match the requested test release." >&2
            exit 1
          }
          install -m 0755 "$agent_binary" "$stage_dir/device-state-console-agent"
          install -m 0644 deploy/update-test-agents.sh "$stage_dir/update-test-agents.sh"

          rollback_dir="$stage_dir/rollback"
          mkdir -p "$rollback_dir"
          [[ -n "${ROLLBACK_VERSIONS//[[:space:]]/}" ]] || {
            echo "At least one rollback version is required." >&2
            exit 1
          }
          for rollback_version in $ROLLBACK_VERSIONS; do
            [[ "$rollback_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Rollback versions must be fixed semantic versions." >&2
              exit 1
            }
            rollback_asset="DeviceStateConsole-Linux-Install-v${rollback_version}.deb"
            rollback_url="https://github.com/IGNGserver/guanlan-monitor/releases/download/v${rollback_version}"
            curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 180 \
              "$rollback_url/$rollback_asset.sha256" -o "$rollback_dir/$rollback_asset.sha256"
            curl -4 -fL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 300 \
              "$rollback_url/$rollback_asset" -o "$rollback_dir/$rollback_asset"
            verify_asset_checksum "$rollback_dir/$rollback_asset" "$rollback_dir/$rollback_asset.sha256"
            [[ "$(dpkg-deb -f "$rollback_dir/$rollback_asset" Version)" == "$rollback_version" ]] || {
              echo "The rollback Debian package version does not match $rollback_version." >&2
              exit 1
            }
            echo "Rollback package $rollback_version is staged and verified."
          done

      - name: Upload staged Agent package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-agent-release-${{ inputs.version }}
          path: |
            release/device-state-console-agent
            release/update-test-agents.sh
            release/DeviceStateConsole-Linux-Install-v${{ inputs.version }}.deb
            release/DeviceStateConsole-Linux-Install-v${{ inputs.version }}.deb.sha256
            release/rollback/*
          if-no-files-found: error

  update:
    name: Update Linux Agents
    needs: stage
    runs-on: [self-hosted, Linux, X64, nas]
    timeout-minutes: 60
    environment: test
    steps:
      - name: Validate request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Agent update requires a fixed semantic version." >&2
            exit 1
          }
          [[ -n "${TARGETS//[[:space:]]/}" ]] || {
            echo "At least one Agent target is required." >&2
            exit 1
          }
          for target in $TARGETS; do
            [[ "$target" =~ ^[A-Za-z0-9_.:-]+$ ]] || {
              echo "Invalid SSH target: $target" >&2
              exit 1
            }
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_DEPLOY_SSH_KNOWN_HOSTS }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          needs_ssh=false
          for target in $TARGETS; do
            case "$target" in
              nas|localhost|127.0.0.1) ;;
              *) needs_ssh=true ;;
            esac
          done
          if [[ -n "$SSH_PRIVATE_KEY" && -z "$SSH_KNOWN_HOSTS" ]] || [[ -z "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]; then
            echo "SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS must be provided together." >&2
            exit 1
          fi
          if [[ "$needs_ssh" == "true" ]]; then
            test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is required for remote Agent updates." >&2; exit 1; }
            test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS is required for remote Agent updates." >&2; exit 1; }
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          fi

      - name: Download staged Agent package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-agent-release-${{ inputs.version }}
          path: ${{ runner.temp }}/dsc-agent-artifact-${{ github.run_id }}

      - name: Update and verify each Agent
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.TEST_DEPLOY_PASSWORD }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
          ALLOW_KNOWN_400_TARGETS: ${{ inputs.allow_known_http_400_targets }}
        run: bash "$RUNNER_TEMP/dsc-agent-artifact-${GITHUB_RUN_ID}/update-test-agents.sh"
