name: Build and publish test release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version
        run: pnpm verify:version

      - name: Verify installer and package compatibility
        run: |
          pnpm verify:windows-installer
          pnpm verify:linux-package

      - name: Verify bundled PawnIO integrity metadata
        run: pnpm verify:windows-hardware

      - name: Verify Hub public port
        run: pnpm verify:hub-port

      - name: Verify Web security headers
        run: pnpm verify:web-security-headers

      - name: Verify Compose environment migration
        run: bash scripts/test-compose-env-migration.sh

      - name: Test server VM inventory reconciliation
        env:
          NODE_ENV: test
          SESSION_SECRET: dsc-ci-session-secret-please-use-only-for-tests
          ACCESS_KEY: dsc-ci-access-key-please-use-only-for-tests
        run: |
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/server test

      - name: Typecheck and build web packages
        run: |
          pnpm check:desktop-ui-boundaries
          pnpm check:web-ui-boundary
          pnpm check:adapter-contracts
          pnpm test:adapter-contracts
          pnpm test:ui-helpers
          pnpm test:workspace-contracts
          pnpm test:renderer-security
          pnpm test:window-material
          pnpm typecheck
          pnpm build

      - name: Test and build Go agents
        working-directory: agents
        run: |
          go test ./...
          go build ./...

  windows:
    name: Build Windows assets
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"

      - name: Setup .NET for hardware sensor probe
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.x

      - name: Install desktop dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Build bundled Windows Agent binaries
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path release/desktop-agent | Out-Null
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=$version -X main.BuildChannel=test" -o ..\release\desktop-agent\device-state-console-agent.exe .
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=$version -X main.BuildChannel=test" -o ..\release\desktop-agent\device-state-console-agent-backend.exe ./cmd/windows-agent-backend
          # Ship the backend under its product name. The historical name is kept
          # for one release cycle so an in-place upgrade keeps working.
          Copy-Item -LiteralPath "release/desktop-agent/device-state-console-agent-backend.exe" -Destination "release/desktop-agent/guanlan-agent.exe" -Force

      - name: Add Windows hardware sensor probe and monitor assets
        shell: powershell
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "device-state-console-hardware-probe"
          dotnet publish tools/HardwareSensorProbe/HardwareSensorProbe.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $probeDir
          New-Item -ItemType Directory -Force -Path "release/desktop-agent/hardware-sensor-probe" | Out-Null
          Copy-Item -Path (Join-Path $probeDir "*") -Destination "release/desktop-agent/hardware-sensor-probe" -Recurse -Force
          Copy-Item -Path "agents/windows-hardware" -Destination "release/desktop-agent/windows-hardware" -Recurse -Force
          node scripts/verify-windows-hardware-integrity.mjs
          $pawnIo = Join-Path (Get-Location) "release/desktop-agent/windows-hardware/pawnio/PawnIO_setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $pawnIo
          if ($signature.Status -ne "Valid") { throw "Bundled PawnIO installer is not Authenticode-valid: $($signature.Status)" }

      - name: Build Windows Electron setup and portable assets
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "release/windows-desktop"
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/desktop build
          pnpm --filter @dsc/desktop exec electron-builder --win nsis dir --publish never "--config.directories.output=$outputDir"
          $unpacked = Join-Path $outputDir "win-unpacked"
          if (-not (Test-Path $unpacked)) { throw "Electron unpacked directory missing: $unpacked" }
          node scripts/verify-electron-artifact-version.mjs $unpacked $version
          if (-not (Test-Path (Join-Path $unpacked "resources/agent/hardware-sensor-probe/HardwareSensorProbe.dll"))) { throw "Packaged hardware sensor probe missing." }
          if (-not (Test-Path (Join-Path $unpacked "resources/agent/windows-hardware/librehardwaremonitor/LibreHardwareMonitorLib.dll"))) { throw "Packaged hardware monitor library missing." }
          node scripts/verify-windows-hardware-integrity.mjs (Join-Path $unpacked "resources/agent/windows-hardware/pawnio/PawnIO_setup.exe")
          $packagedPawnIoSignature = Get-AuthenticodeSignature -LiteralPath (Join-Path $unpacked "resources/agent/windows-hardware/pawnio/PawnIO_setup.exe")
          if ($packagedPawnIoSignature.Status -ne "Valid") { throw "Packaged PawnIO installer is not Authenticode-valid: $($packagedPawnIoSignature.Status)" }
          $portable = Join-Path $outputDir "DeviceStateConsole-Windows-GUI-Portable-v$version.zip"
          Compress-Archive -Path (Join-Path $unpacked "*") -DestinationPath $portable -CompressionLevel Optimal -Force
          $update = Join-Path $outputDir "DeviceStateConsole-Windows-GUI-Update-v$version.zip"
          Compress-Archive -Path (Join-Path $unpacked "*") -DestinationPath $update -CompressionLevel Optimal -Force
          Get-ChildItem $outputDir -File | Select-Object Name,Length

      - name: Silently install, reinstall and verify Windows GUI setup
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = Join-Path $env:GITHUB_WORKSPACE "release/windows-desktop/DeviceStateConsole-Windows-GUI-Setup-v$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Windows GUI setup is missing: $setup" }
          $installer = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Windows GUI silent installation failed with exit code $($installer.ExitCode)." }
          $installRoot = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent"
          if (-not (Test-Path -LiteralPath $installRoot -PathType Container)) { throw "Windows GUI installation directory is missing: $installRoot" }
          node scripts/verify-electron-artifact-version.mjs $installRoot $version
          $mainExecutables = @(Get-ChildItem -LiteralPath $installRoot -File -Filter "*.exe" | Where-Object { $_.Name -notlike "Uninstall *" })
          if ($mainExecutables.Count -ne 1) {
            $found = ($mainExecutables | ForEach-Object { $_.Name }) -join ", "
            throw "Expected exactly one installed Windows GUI executable, found $($mainExecutables.Count): $found"
          }
          $mainExecutables[0] | Select-Object FullName,Length
          $reinstaller = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($reinstaller.ExitCode -ne 0) { throw "Windows GUI silent reinstallation failed with exit code $($reinstaller.ExitCode)." }
          node scripts/verify-electron-artifact-version.mjs $installRoot $version

      - name: Install isolated Playwright runner for installed GUI acceptance
        shell: powershell
        run: |
          $playwrightDir = Join-Path $env:RUNNER_TEMP "dsc-release-playwright"
          New-Item -ItemType Directory -Force -Path $playwrightDir | Out-Null
          npm init -y --prefix $playwrightDir | Out-Null
          npm install --prefix $playwrightDir --no-save playwright@1.55.0

      - name: Launch installed Release setup and capture Windows evidence
        shell: powershell
        env:
          DSC_RELEASE_VERSION: ${{ github.ref_name }}
          NODE_ENV: test
          DSC_VISUAL_FIXTURE: "1"
          DSC_RELEASE_ACCEPTANCE_DEVICE_ID: visual-vm
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installRoot = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent"
          $main = @(Get-ChildItem -LiteralPath $installRoot -File -Filter "*.exe" | Where-Object { $_.Name -notlike "Uninstall *" })
          if ($main.Count -ne 1) { throw "Expected exactly one installed GUI executable for launch acceptance." }
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "release/windows-desktop/release-launch-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $env:NODE_PATH = Join-Path $env:RUNNER_TEMP "dsc-release-playwright/node_modules"
          $env:DSC_RELEASE_VERSION = $version
          node scripts/electron-release-acceptance.cjs $main[0].FullName $evidenceDir

      - name: Smoke test bundled Windows Agent backend
        shell: powershell
        run: |
          $backend = Join-Path (Get-Location) "release/desktop-agent/device-state-console-agent-backend.exe"
          $configRoot = Join-Path $env:RUNNER_TEMP "device-state-console-release-config"
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          $tokenFile = Join-Path $configRoot "smoke-token"
          Set-Content -LiteralPath $tokenFile -Value "release-smoke-token" -NoNewline -Encoding ascii
          $process = Start-Process -FilePath $backend -ArgumentList @("--listen", "127.0.0.1:17931", "--bundle-root", (Split-Path $backend), "--config-root", $configRoot, "--local-token-file", $tokenFile) -WindowStyle Hidden -PassThru
          try {
            $state = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $state = Invoke-RestMethod -Uri "http://127.0.0.1:17931/api/state" -Headers @{ "X-DSC-Local-Token" = "release-smoke-token" } -TimeoutSec 2
                break
              } catch { }
            }
            if (-not $state) { throw "Bundled Agent backend did not become reachable." }
            if (-not $state.configFileExists) { throw "Bundled Agent backend did not create config." }
            Invoke-RestMethod -Uri "http://127.0.0.1:17931/api/control/shutdown" -Method Post -Headers @{ "X-DSC-Local-Token" = "release-smoke-token" } -TimeoutSec 3 | Out-Null
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-assets
          path: |
            release/windows-desktop/DeviceStateConsole-Windows-GUI-Setup-v*.exe
            release/windows-desktop/DeviceStateConsole-Windows-GUI-Update-v*.zip
            release/windows-desktop/DeviceStateConsole-Windows-GUI-Portable-v*.zip
            release/windows-desktop/release-launch-evidence/Windows-GUI-Release-Launch-Evidence-v*.json
          if-no-files-found: error

  headless-windows:
    name: Verify headless Windows install, service and reporting
    runs-on: windows-latest
    needs: windows
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download the Windows install package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release-assets
          path: release-assets

      - name: Install silently with configuration switches
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = Join-Path $env:GITHUB_WORKSPACE "release-assets/DeviceStateConsole-Windows-GUI-Setup-v$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Windows GUI setup is missing: $setup" }
          $env:DSC_HEADLESS_KEY = "ci-headless-access-key"
          $env:DSC_HEADLESS_MARKER = Join-Path $env:RUNNER_TEMP "ingest.json"
          Start-Process -FilePath "node" -ArgumentList @(
            "scripts/headless-hub-stub.mjs", "serve",
            "--port", "3199",
            "--marker", "`"$env:DSC_HEADLESS_MARKER`"",
            "--key", $env:DSC_HEADLESS_KEY
          ) -WindowStyle Hidden
          Start-Sleep -Seconds 4
          # Values containing a slash must be quoted for the NSIS switch parser.
          $installer = Start-Process -FilePath $setup -ArgumentList @(
            "/S",
            "/HUB=`"http://127.0.0.1:3199`"",
            "/KEY=`"$env:DSC_HEADLESS_KEY`"",
            "/DEVICE=ci-headless",
            "/HOSTNAME=ci-headless",
            "/VERIFY=180"
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            # Dump the local state so a failure explains itself instead of only
            # reporting an exit code.
            $agentCli = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent\bin\guanlan-agent.exe"
            if (Test-Path -LiteralPath $agentCli) {
              Write-Output "--- status ---"
              & $agentCli status --json
              Write-Output "--- service ---"
              Get-Service -Name "GuanlanAgent" -ErrorAction SilentlyContinue | Format-List Name,Status,StartType
              Write-Output "--- machine configuration ---"
              Get-ChildItem -LiteralPath (Join-Path $env:ProgramData "Guanlan") -ErrorAction SilentlyContinue | Select-Object Name,Length
              Write-Output "--- backend log (tail) ---"
              Get-Content -LiteralPath (Join-Path $env:ProgramData "Guanlan\agent-ui.backend.log") -Tail 40 -ErrorAction SilentlyContinue
            } else {
              Write-Output "agent CLI not found at $agentCli"
            }
            throw "Silent installation with /VERIFY failed with exit code $($installer.ExitCode)."
          }

      - name: Verify the machine-scope service and the first upload
        shell: powershell
        run: |
          $service = Get-Service -Name "GuanlanAgent" -ErrorAction Stop
          if ($service.StartType -ne "Automatic") { throw "The agent service must start automatically, found $($service.StartType)." }
          if ($service.Status -ne "Running") { throw "The agent service must be running, found $($service.Status)." }
          $cli = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent\bin\guanlan-agent.exe"
          if (-not (Test-Path -LiteralPath $cli)) { throw "The agent CLI is missing: $cli" }
          $before = (& $cli status --json | Out-String) | ConvertFrom-Json
          if (-not $before.serviceInstalled) { throw "status does not report an installed service." }
          if (-not $before.autoStartCollector) { throw "a machine-scope service must collect continuously by default." }
          if (-not $before.collectorRunning) { throw "the collector is not running after the service started." }
          & $cli wait-for-upload --timeout 180
          if ($LASTEXITCODE -ne 0) { throw "No first upload was confirmed within 180 seconds." }
          if (-not (Test-Path -LiteralPath $env:DSC_HEADLESS_MARKER)) { throw "The stub Hub never received an ingest." }
          $after = (& $cli status --json | Out-String) | ConvertFrom-Json
          if (-not $after.lastUploadAt) { throw "status does not report lastUploadAt after the first upload." }
          if (-not $after.configured) { throw "status does not report a configured agent after the unattended install." }
          Get-Content -LiteralPath $env:DSC_HEADLESS_MARKER

      - name: Verify recovery after a service restart with no UI
        shell: powershell
        run: |
          Remove-Item -LiteralPath $env:DSC_HEADLESS_MARKER -ErrorAction SilentlyContinue
          Restart-Service -Name "GuanlanAgent" -Force
          Start-Sleep -Seconds 5
          $cli = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent\bin\guanlan-agent.exe"
          $service = Get-Service -Name "GuanlanAgent"
          if ($service.Status -ne "Running") { throw "The agent service did not come back after a restart." }
          & $cli wait-for-upload --timeout 180
          if ($LASTEXITCODE -ne 0) { throw "Reporting did not resume after the service restart." }
          if (-not (Test-Path -LiteralPath $env:DSC_HEADLESS_MARKER)) { throw "No ingest arrived after the restart." }
          $status = (& $cli status --json | Out-String) | ConvertFrom-Json
          if (-not $status.lastUploadAt) { throw "status does not report lastUploadAt after the restart." }
          if (-not $status.collectorRunning) { throw "the collector is not running after the restart." }

      - name: Verify silent uninstall removes the service and keeps the configuration
        shell: powershell
        run: |
          $installRoot = Join-Path $env:ProgramFiles "DeviceStateConsoleAgent"
          $configPath = Join-Path $env:ProgramData "Guanlan\agent-ui.config.json"
          if (-not (Test-Path -LiteralPath $configPath)) { throw "The unattended configuration was not written: $configPath" }
          $uninstaller = Join-Path $installRoot "Uninstall 观澜.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "The uninstaller is missing: $uninstaller" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList @("/S", "_?=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstallation failed with exit code $($process.ExitCode)." }
          if (Get-Service -Name "GuanlanAgent" -ErrorAction SilentlyContinue) { throw "The agent service must be removed with the application." }
          if (-not (Test-Path -LiteralPath $configPath)) { throw "Uninstall must preserve the machine-scope configuration." }

  linux-gui:
    name: Build unified Linux Electron GUI asset
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.x"

      - name: Install desktop dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Build bundled Linux Agent binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release/desktop-agent
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=${version} -X main.BuildChannel=test" -o ../release/desktop-agent/device-state-console-agent .
          go -C agents build -trimpath -ldflags "-s -w -X main.BuildVersion=${version} -X main.BuildChannel=test" -o ../release/desktop-agent/device-state-console-agent-backend ./cmd/windows-agent-backend
          # Ship the backend under its product name. The historical name is kept
          # for one release cycle so an in-place upgrade keeps working.
          # "install" runs from the repository root, not from agents/.
          install -m 0755 release/desktop-agent/device-state-console-agent-backend release/desktop-agent/guanlan-agent

      - name: Build Linux Electron GUI install package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/release/linux-desktop"
          pnpm --filter @dsc/shared build
          pnpm --filter @dsc/desktop build
          pnpm --filter @dsc/desktop exec electron-builder --linux deb --publish never "--config.directories.output=$output_dir"
          package="$(find "$output_dir" -maxdepth 1 -type f -name 'DeviceStateConsole-Linux-GUI-Install-v*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F 'resources/agent/device-state-console-agent'
          dpkg-deb --contents "$package" | grep -F 'resources/agent/device-state-console-agent-backend'
          dpkg-deb --contents "$package" | grep -F 'resources/agent/guanlan-agent'
          sha256sum "$package" > "$package.sha256"

      - name: Upload Linux GUI asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-gui-release-assets
          path: |
            release/linux-desktop/DeviceStateConsole-Linux-GUI-Install-v*.deb
            release/linux-desktop/DeviceStateConsole-Linux-GUI-Install-v*.deb.sha256
          if-no-files-found: error

  headless-linux:
    name: Verify headless Linux install, service and reporting
    runs-on: ubuntu-24.04
    needs: linux-gui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download the Linux install package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-gui-release-assets
          path: release-assets

      - name: Install the package without a desktop session
        shell: bash
        run: |
          set -euo pipefail
          package="$(find release-assets -maxdepth 1 -name 'DeviceStateConsole-Linux-GUI-Install-v*.deb' -print -quit)"
          test -n "$package"
          sudo apt-get update -qq
          if ! sudo apt-get install -y "./$package"; then
            echo "apt could not resolve the package dependencies directly; unpacking and repairing" >&2
            sudo dpkg -i "$package" || true
            sudo apt-get -f install -y
          fi
          dpkg-query -W -f='${Package} ${Version}\n' guanlan-desktop

      - name: Verify the machine-scope service is enabled and running
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-enabled guanlan-agent.service
          sudo systemctl is-active guanlan-agent.service
          sudo systemctl show -p UnitFileState,WantedBy guanlan-agent.service
          test -x /usr/bin/guanlan-agent
          sudo guanlan-agent status --json | tee "$RUNNER_TEMP/status-before.json"
          node -e "const d=require(process.env.RUNNER_TEMP + '/status-before.json'); if (!d.serviceInstalled || !d.serviceRunning) { console.error('the service is not reported as installed and running', d); process.exit(1); } if (!d.autoStartCollector) { console.error('a machine-scope service must collect continuously by default', d); process.exit(1); } if (!d.collectorRunning) { console.error('the collector is not running after the service started', d); process.exit(1); }"

      - name: Verify reporting through a stub Hub
        shell: bash
        env:
          DSC_HEADLESS_KEY: ci-headless-access-key
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/ingest.json"
          # The stub has to outlive this step: the restart check below waits for
          # a second ingest after the service comes back.
          nohup node scripts/headless-hub-stub.mjs serve --port 3199 \
            --marker "$marker" --key "$DSC_HEADLESS_KEY" > "$RUNNER_TEMP/stub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stub.pid"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3199/api/agent/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3199/api/agent/ping >/dev/null
          printf '%s' "$DSC_HEADLESS_KEY" | sudo guanlan-agent config set \
            --hub http://127.0.0.1:3199 \
            --key-stdin \
            --device-id ci-headless \
            --hostname ci-headless
          sudo guanlan-agent wait-for-upload --timeout 150
          test -f "$marker"
          cat "$marker"

      - name: Verify the service recovers after a restart without any UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/ingest.json"
          sudo systemctl restart guanlan-agent.service
          sudo systemctl is-active guanlan-agent.service
          sudo guanlan-agent wait-for-upload --timeout 150
          test -f "$RUNNER_TEMP/ingest.json"
          sudo guanlan-agent status --json | tee "$RUNNER_TEMP/status-after.json"
          node -e "const d=require(process.env.RUNNER_TEMP + '/status-after.json'); if (!d.lastUploadAt) { console.error('status did not report lastUploadAt after the restart', d); process.exit(1); } if (!d.configured) { console.error('status did not report a configured agent', d); process.exit(1); } if (!d.collectorRunning) { console.error('the collector is not running after the restart', d); process.exit(1); }"

      - name: Verify removal keeps the configuration
        shell: bash
        run: |
          set -euo pipefail
          # The machine directory is 0700 and owned by the service account, so
          # these probes must run elevated; that restriction is the point.
          sudo test -f /etc/guanlan/agent-ui.config.json
          sudo dpkg -r guanlan-desktop
          if systemctl is-enabled --quiet guanlan-agent.service 2>/dev/null; then
            echo "the agent service must not survive package removal" >&2
            exit 1
          fi
          sudo test -f /etc/guanlan/agent-ui.config.json
          sudo dpkg --purge guanlan-desktop
          sudo test ! -d /etc/guanlan
          if [ -f "$RUNNER_TEMP/stub.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/stub.pid")" 2>/dev/null || true
          fi

  android:
    name: Build Android asset
    runs-on: ubuntu-latest
    needs: verify
    environment: test-release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run Android unit tests and lint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Prepare Android signing key
        shell: bash
        env:
          DSC_ANDROID_KEYSTORE_BASE64: ${{ secrets.DSC_ANDROID_KEYSTORE_BASE64 }}
          DSC_ANDROID_STORE_PASSWORD: ${{ secrets.DSC_ANDROID_STORE_PASSWORD }}
          DSC_ANDROID_KEY_ALIAS: ${{ secrets.DSC_ANDROID_KEY_ALIAS }}
          DSC_ANDROID_KEY_PASSWORD: ${{ secrets.DSC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/device-state-console-release.jks"

          [[ -n "$DSC_ANDROID_KEYSTORE_BASE64" && -n "$DSC_ANDROID_STORE_PASSWORD" && -n "$DSC_ANDROID_KEY_ALIAS" && -n "$DSC_ANDROID_KEY_PASSWORD" ]] \
            || { echo "Configured Android signing credentials are required; refusing an ephemeral signing key." >&2; exit 1; }
          printf '%s' "$DSC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$DSC_ANDROID_STORE_PASSWORD" \
            -alias "$DSC_ANDROID_KEY_ALIAS" >/dev/null

          {
            echo "DSC_UPLOAD_STORE_FILE=$keystore"
            echo "DSC_UPLOAD_STORE_PASSWORD=$DSC_ANDROID_STORE_PASSWORD"
            echo "DSC_UPLOAD_KEY_ALIAS=$DSC_ANDROID_KEY_ALIAS"
            echo "DSC_UPLOAD_KEY_PASSWORD=$DSC_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK for testing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Gradle Android release attempt ${attempt}/4"
            if bash ./gradlew :app:assembleRelease --no-daemon; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Gradle dependency resolution failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Name Android asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          test ! -e "android/app/build/outputs/apk/release/app-release-unsigned.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release/android
          cp "$apk" "release/android/DeviceStateConsole-Android-v${version}.apk"

      - name: Upload Android asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-assets
          path: release/android/DeviceStateConsole-Android-v*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub test release
    runs-on: ubuntu-latest
    needs:
      - windows
      - headless-windows
      - linux-gui
      - headless-linux
      - android
    if: ${{ always() && needs.windows.result == 'success' && needs['headless-windows'].result == 'success' && needs['linux-gui'].result == 'success' && needs['headless-linux'].result == 'success' && needs.android.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Validate tag and asset set
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          while IFS= read -r asset; do
            case "$asset" in
              *.exe|*.zip|*.deb|*.apk)
                checksum="${asset}.sha256"
                if [[ ! -f "$checksum" ]]; then
                  asset_dir="$(dirname "$asset")"
                  asset_name="$(basename "$asset")"
                  (cd "$asset_dir" && sha256sum "$asset_name") > "$checksum"
                fi
                ;;
            esac
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.apk' \) -print)
          find release-assets -type f -print
          test "$(find release-assets -type f -name 'DeviceStateConsole-Windows-GUI-Setup-v*.exe' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'Windows-GUI-Release-Launch-Evidence-v*.json' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Windows-GUI-Portable-v*.zip' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Windows-GUI-Update-v*.zip' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Linux-GUI-Install-v*.deb' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Linux-GUI-Install-v*.deb.sha256' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Android-v*.apk' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Windows-GUI-Setup-v*.exe.sha256' | wc -l)" -eq 1
          test "$(find release-assets -type f -name 'DeviceStateConsole-Android-v*.apk.sha256' | wc -l)" -eq 1

      - name: Publish prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Device State Console ${{ github.ref_name }} (测试版)
          body_path: ${{ format('release-notes-{0}.md', github.ref_name) }}
          prerelease: true
          files: release-assets/**/*
