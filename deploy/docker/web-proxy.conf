# No URI suffix: preserve the original path, query, credentials and request body.
proxy_pass http://hub_backend;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
# The map accepts https only from explicitly allowlisted TCP peers; an empty
# allowlist always uses the observed scheme, never browser-supplied forwarding.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header Upgrade $websocket_upgrade;
proxy_set_header Connection $websocket_connection;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
