user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Preserve Next's compressed transfer behavior for the exported JS/CSS/HTML.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    # Queries can contain agent tokens; do not put them in access logs.
    log_format public '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout public;

    map $http_upgrade $websocket_upgrade {
        default "";
        ~*^websocket$ websocket;
    }
    map $websocket_upgrade $websocket_connection {
        default "";
        websocket upgrade;
    }
    map "$status:$uri" $web_cache_control {
        default "no-store, no-cache, max-age=0, must-revalidate";
        "~^(?:200|206|304):/icons/[a-f0-9]{12}/[a-z0-9-]+\.png$" "public, max-age=31536000, immutable";
        "~^(?:200|206|304):/_next/static/(?:[^/]+/)*[^/]*[a-f0-9]{8,}[^/]*\.(?:js|css|woff2?|png|webp|svg)$" "public, max-age=31536000, immutable";
    }
    map $uri $service_worker_scope {
        default "";
        /sw.js /;
    }
    # There is no RSC endpoint in this public-only export. Reject flight probes
    # instead of accidentally returning an HTML document or an exported .txt.
    map $args $rsc_query {
        default 0;
        ~*(^|&)_rsc(=|&|$) 1;
    }

    # Only the TCP peer can establish trust. No real_ip rewriting or browser
    # forwarding header may choose the address consulted by this allowlist.
    geo $remote_addr $trusted_tls_proxy {
        default 0;
        include /etc/nginx/web-trusted-tls-proxies.conf;
    }
    map "$trusted_tls_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        # Case-sensitive and anchored: no lists, whitespace or other schemes.
        ~^1:https$ https;
    }
    # Use the raw URL, not the decoded location capture: an encoded ?/# or slash
    # in a device ID must not become a different path/query in the redirect.
    map $request_uri $canonical_device_uri {
        default "";
        ~^(/devices/[^/?]+)/(\?.*)?$ $1$2;
    }

    # Docker's embedded DNS refreshes the same fixed Compose service target;
    # SERVER_API_URL / NEXT_PUBLIC_SERVER_URL cannot redirect this upstream.
    resolver 127.0.0.11 valid=30s ipv6=off;
    upstream hub_backend {
        zone hub_backend 64k;
        server server:4000 resolve;
        keepalive 16;
    }

    server {
        listen 3000;
        server_name _;
        root /srv/guanlan;
        autoindex off;
        client_max_body_size 10m;
        include /etc/nginx/web-security-headers.conf;

        if ($http_rsc != "") { return 404; }
        if ($rsc_query) { return 404; }

        location = /api { include /etc/nginx/web-proxy.conf; }
        location ^~ /api/ { include /etc/nginx/web-proxy.conf; }
        location = /socket.io { include /etc/nginx/web-proxy.conf; }
        location ^~ /socket.io/ { include /etc/nginx/web-proxy.conf; }

        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /sw.js {
            default_type application/javascript;
            try_files $uri =404;
        }
        location = /manifest.json {
            types { application/manifest+json json; }
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            try_files $uri =404;
        }
        location = /pwa-assets.json { try_files $uri =404; }
        location ~ "^/icons/[a-f0-9]{12}/[a-z0-9-]+\.png$" { try_files $uri =404; }

        # Never serve export internals, source maps or configuration files.
        # Regex order matters: these denials precede the device shell fallback.
        location ~ (?:^|/)\. { return 404; }
        location ~* \.(?:txt|map|html)/?$ { return 404; }
        location ~ ^/devices/[^/]+/$ {
            if ($canonical_device_uri = "") { return 404; }
            absolute_redirect off;
            return 308 $canonical_device_uri;
        }
        location ~ ^/devices/[^/]+$ { try_files /index.html =404; }
        location ~ ^/_next/static/.+\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|ico|svg)$ {
            try_files $uri =404;
        }
        location ~ ^/(?:favicon\.(?:ico|png)|icon\.png|apple-icon\.png|logo\.png|apple-touch-icon(?:-(?:152|167|180))?\.png|icon-(?:192|512|1024)(?:-maskable)?\.png)$ {
            try_files $uri =404;
        }
        # Unknown paths must not be turned into successful SPA navigations.
        location / { return 404; }
    }
}
